spring:
  application:
    name: game-be

  # 上传限制（签到奖励图等）
  servlet:
    multipart:
      max-file-size: 2MB
      max-request-size: 3MB
  
  # MySQL 配置
  datasource:
    url: jdbc:mysql://${DB_HOST:39.105.174.212}:${DB_PORT:3300}/${DB_NAME:game}?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      minimum-idle: 5
      maximum-pool-size: 20
      idle-timeout: 30000
      max-lifetime: 1800000
      connection-timeout: 30000
      pool-name: WordGameHikariPool

  # Redis 配置
  redis:
    host: ${REDIS_HOST:39.105.174.212}
    port: ${REDIS_PORT:6379}
    password: ${REDIS_PASSWORD:}
    database: 0
    timeout: 5000ms
    lettuce:
      pool:
        max-active: 16
        max-wait: -1ms
        max-idle: 8
        min-idle: 2

# 日志配置：输出到文件（容器内 /app/logs，由 docker-compose 挂载到宿主机）
logging:
  file:
    name: /app/logs/game-be.log
  logback:
    rollingpolicy:
      max-file-size: 100MB
      max-history: 15
      total-size-cap: 2GB

# MyBatis 配置
mybatis:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.sniper.game.wordgame.entity
  configuration:
    map-underscore-to-camel-case: true

wx:
  miniapp:
    appid: ${WX_MINIAPP_APPID:}
    secret: ${WX_MINIAPP_SECRET:}
    jscode2session-url: ${WX_MINIAPP_JSCODE2SESSION_URL:https://api.weixin.qq.com/sns/jscode2session?appid=%s&secret=%s&js_code=%s&grant_type=authorization_code}

dy:
  miniapp:
    appid: ${DY_MINIAPP_APPID:}
    secret: ${DY_MINIAPP_SECRET:}
    jscode2session-url: ${DY_MINIAPP_JSCODE2SESSION_URL:https://developer.toutiao.com/api/apps/v2/jscode2session}

# 飞书机器人通知
feishu:
  webhook:
    url: ${FEISHU_WEBHOOK_URL:https://open.feishu.cn/open-apis/bot/v2/hook/2caebfd0-db3f-4ef8-a1c1-fc9747e51a2f}

# 阿里云 OSS（签到奖励图等资源上传）
oss:
  endpoint: ${OSS_ENDPOINT:oss-cn-beijing.aliyuncs.com}
  bucket: ${OSS_BUCKET:fruit-pop-game}
  access-key-id: ${OSS_ACCESS_KEY_ID:}
  access-key-secret: ${OSS_ACCESS_KEY_SECRET:}
  public-domain: ${OSS_PUBLIC_DOMAIN:https://fruit-pop-game.oss-cn-beijing.aliyuncs.com}
